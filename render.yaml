services:
  - type: web
    name: chuan-yue-kimi-proxy
    runtime: node
    rootDir: kimi-proxy
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: KIMI_MODEL
        value: kimi-k2.6
      - key: KIMI_API_KEY
        sync: false
