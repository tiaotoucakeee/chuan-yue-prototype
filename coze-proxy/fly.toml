app = "chuan-yue-coze-proxy"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[env]
  COZE_BOT_ID = "7631445325035208742"
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
